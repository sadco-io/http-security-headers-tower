[package]
name = "http-security-headers"
version = "0.4.0"
edition = "2021"
# 1.85 is the floor for the default build and for `middleware`, `nonce` and
# `observability`. The `actix` feature additionally requires 1.88 -- actix-web,
# actix-http and actix-server all declare rust-version = "1.88". Both floors are
# enforced by separate CI jobs. The 1.75 declared through 0.2.0 was never buildable.
rust-version = "1.85"
authors = ["Daniel Curtis <drc@danielryancurtis.com>"]
description = "Type-safe, framework-agnostic HTTP security headers with Tower middleware support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sadco-io/http-security-headers-tower"
documentation = "https://docs.rs/http-security-headers"
keywords = ["security", "headers", "middleware", "http", "tower"]
categories = ["web-programming", "network-programming"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# docs.rs builds with default features, and this crate's default set is empty --
# so without this every optional module is absent from the rendered page. The
# 0.2.0 docs prove it: .../http_security_headers/middleware/index.html is a 404
# on a crate whose headline feature is Tower middleware.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
middleware = ["tower", "http", "http-body", "pin-project-lite"]
actix = ["middleware", "actix-web", "futures-util"]
nonce = ["getrandom"]
observability = ["tracing"]

[dependencies]
# Error handling
thiserror = "2.0.20"

# Optional: Tower middleware
tower = { version = "0.5.3", optional = true }
http = { version = "1.5.0", optional = true }
http-body = { version = "1.1.0", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }

# Optional: Actix integration.
#
# `default-features = false` is deliberate. actix-web's default set pulls in
# HTTP/2, three compression backends and cookie handling, none of which a header
# middleware touches. Dropping them also drops `h2` 0.3, whose newest release
# (0.3.27) still carries GHSA-q83h-524g-xf6h -- the fix landed only in the 0.4
# line, which actix-http 3.x cannot use. An application that enables actix-web's
# `http2` itself still resolves h2 0.3; we simply stop being the reason.
actix-web = { version = "4.15", default-features = false, features = [
    "macros",
], optional = true }
futures-util = { version = "0.3.34", optional = true }

# Optional: CSP nonce generation. getrandom is the OS entropy shim `rand` itself
# builds on -- it adds only cfg-if and libc, both already present under `actix`.
getrandom = { version = "0.4.3", optional = true }

# Optional: Observability
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
axum = "0.8.9"
tower = "0.5.3"
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper = { version = "1.11", features = ["full"] }

[[test]]
name = "middleware_axum"
required-features = ["middleware"]

[[test]]
name = "nonce_middleware"
required-features = ["middleware", "nonce"]

[[example]]
name = "axum_basic"
required-features = ["middleware"]

[[example]]
name = "axum_custom"
required-features = ["middleware"]

[[example]]
name = "axum_nonce"
required-features = ["middleware", "nonce"]

[[example]]
name = "actix_basic"
required-features = ["actix"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
